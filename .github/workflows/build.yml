name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6
      - name: Create Project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/belami/horroroffline
          mkdir -p app/src/main
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:7.4.2'}}allprojects{repositories{google();mavenCentral()}}" > build.gradle
          echo "apply plugin:'com.android.application';android{compileSdkVersion 33;defaultConfig{applicationId 'com.belami.horroroffline';minSdkVersion 21;targetSdkVersion 33;versionCode 15;versionName '15'};namespace 'com.belami.horroroffline'}" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><application android:label="BelAmi Horror Offline"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.belami.horroroffline;import android.app.Activity;import android.os.Bundle;import android.widget.*;import android.media.MediaPlayer;import java.io.File;public class MainActivity extends Activity{MediaPlayer m=new MediaPlayer();protected void onCreate(Bundle b){super.onCreate(b);LinearLayout L=new LinearLayout(this);L.setOrientation(1);L.setPadding(20,20,20,20);TextView t=new TextView(this);t.setText("BelAmi HORROR OFFLINE\nFolder: /HorrorStories");L.addView(t);ListView lv=new ListView(this);File d=new File("/storage/emulated/0/HorrorStories");if(!d.exists())d.mkdirs();File[] f=d.listFiles();String[] s={"Walang MP3 - lagay ka sa HorrorStories"};if(f!=null&&f.length>0){s=new String[f.length];for(int i=0;i<f.length;i++)s[i]=f[i].getName();}ArrayAdapter<String> a=new ArrayAdapter(this,android.R.layout.simple_list_item_1,s);lv.setAdapter(a);String[] fn=s;lv.setOnItemClickListener((p,v,i,id)->{try{m.reset();m.setDataSource("/storage/emulated/0/HorrorStories/"+fn[i]);m.prepare();m.start();Toast.makeText(this,"Playing "+fn[i],0).show();}catch(Exception e){}});L.addView(lv);LinearLayout r=new LinearLayout(this);Button b1=new Button(this);b1.setText("PLAY");b1.setOnClickListener(v->{m.start();});Button b2=new Button(this);b2.setText("PAUSE");b2.setOnClickListener(v->{m.pause();});Button b3=new Button(this);b3.setText("STOP");b3.setOnClickListener(v->{m.stop();try{m.prepare();}catch(Exception e){}});r.addView(b1);r.addView(b2);r.addView(b3);L.addView(r);setContentView(L);}}' > app/src/main/java/com/belami/horroroffline/MainActivity.java
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BelAmi-Horror-OFFLINE
          path: app/build/outputs/apk/debug/*.apk
