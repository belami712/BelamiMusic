name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew
          mkdir -p app/src/main/java/com/belami/horroroffline
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'ENDOFFILE'
          buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:7.4.2'}}
          allprojects{repositories{google();mavenCentral()}}
          ENDOFFILE
          cat > app/build.gradle << 'ENDOFFILE'
          apply plugin: 'com.android.application'
          android{compileSdkVersion 33;defaultConfig{applicationId "com.belami.horroroffline";minSdkVersion 21;targetSdkVersion 33;versionCode 11;versionName "11.0"};namespace 'com.belami.horroroffline'}
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><application android:label="BelAmi Horror Offline"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          ENDOFFILE
          cat > app/src/main/java/com/belami/horroroffline/MainActivity.java << 'ENDOFFILE'
          package com.belami.horroroffline;
          import android.app.Activity;import android.os.Bundle;import android.media.MediaPlayer;import android.widget.*;import java.io.File;
          public class MainActivity extends Activity{
          MediaPlayer mp=new MediaPlayer();
          protected void onCreate(Bundle b){super.onCreate(b);
          LinearLayout lay=new LinearLayout(this);lay.setOrientation(1);lay.setPadding(30,30,30,30);
          TextView t=new TextView(this);t.setText("BelAmi HORROR OFFLINE\nFolder: /HorrorStories\nTipid sa Data - Offline!");t.setTextSize(18);lay.addView(t);
          ListView lv=new ListView(this);File dir=new File("/storage/emulated/0/HorrorStories");if(!dir.exists())dir.mkdirs();
          File[] files=dir.listFiles();String[] names={"Walang MP3 - Maglagay sa HorrorStories folder"};if(files!=null&&files.length>0){names=new String[files.length];for(int i=0;i<files.length;i++)names[i]=files[i].getName();}
          ArrayAdapter<String> ad=new ArrayAdapter<>(this,android.R.layout.simple_list_item_1,names);lv.setAdapter(ad);String[] fn=names;
          lv.setOnItemClickListener((a,vv,pos,id)->{try{mp.reset();mp.setDataSource("/storage/emulated/0/HorrorStories/"+fn[pos]);mp.prepare();mp.start();Toast.makeText(this,"Playing: "+fn[pos],0).show();}catch(Exception e){Toast.makeText(this,"Error",1).show();}});lay.addView(lv);
          LinearLayout bl=new LinearLayout(this);bl.setOrientation(0);
          Button p1=new Button(this);p1.setText("PLAY");p1.setOnClickListener(x->{if(!mp.isPlaying())mp.start();});
          Button p2=new Button(this);p2.setText("PAUSE");p2.setOnClickListener(x->{if(mp.isPlaying())mp.pause();});
          Button p3=new Button(this);p3.setText("STOP");p3.setOnClickListener(x->{try{mp.stop();mp.prepare();}catch(Exception e){}});
          bl.addView(p1);bl.addView(p2);bl.addView(p3);lay.addView(bl);setContentView(lay);}}
          ENDOFFILE wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q gradle-7.6-bin.zip./gradle-7.6/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BelAmi-Horror-OFFLINE
          path: app/build/outputs/apk/debug/*.apk
